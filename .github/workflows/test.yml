name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  routing:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tool versions
        run: |
          test_path=/usr/bin:/bin
          env PATH="$test_path" bash -c 'bash --version | head -n 1'
          env PATH="$test_path" bash -c 'command -v jq && jq --version && command -v script'
          env PATH="$test_path" bash -c 'command -v perl && perl -v | head -n 2'
          if [[ "$RUNNER_OS" == macOS ]]; then
            env PATH="$test_path" bash -c 'bash --version | grep -q "^GNU bash, version 3\.2\.57"'
          fi
      - name: Routing tests
        run: python3 -m unittest discover -s tests -v
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s bash -e SC2016 bin/gws
